name: Bug report
description: Report something the plugin gets wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most unplugged player behaviour depends on what else is running on the server, so the version and plugin
        list fields below are what turn a report into something that can be reproduced.

  - type: input
    id: plugin-version
    attributes:
      label: Unplugged AFK version
      description: The version in the JAR filename.
      placeholder: 0.5.0
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      description: The full output of /version on the backend.
      placeholder: Purpur version 1.21.11-...
    validations:
      required: true

  - type: dropdown
    id: proxy
    attributes:
      label: Proxy
      description: Whether the server sits behind a proxy.
      options:
        - No proxy, a single server
        - Velocity
        - Another proxy
    validations:
      required: true

  - type: input
    id: proxy-version
    attributes:
      label: Proxy version
      description: The full output of /velocity info on the proxy. Leave blank if there is no proxy.
      placeholder: Velocity 3.5.0-...
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the plugin did, and what you were doing when it did it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: plugins
    attributes:
      label: Other plugins installed
      description: The output of /plugins on the backend, and of /velocity plugins on the proxy if you run one.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console log
      description: Errors or stack traces from around the time it happened. Link to a paste for anything long.
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your config.yml. Remove link.secret before pasting it.
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: I am on the latest release
          required: true
        - label: Behind a proxy, both JARs come from the same release
          required: false
