name: Feature request
description: Suggest something the plugin should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The README carries a Planned list of features already agreed on. Please check it before filing, so an idea
        that is already queued does not turn into a second issue.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the plugin makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Other plugins, commands or configurations you tried, and why they did not work.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: This is not already on the Planned list in the README
          required: true
