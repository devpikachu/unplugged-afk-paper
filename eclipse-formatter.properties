# Eclipse JDT formatter profile, applied by spotless from both module build scripts.
# alignment_for_* values: 0 never wrap, 16 wrap where necessary, 48 one item per line,
# 80 one item per line but leave the first in place unless it has to move.

org.eclipse.jdt.core.compiler.source=21
org.eclipse.jdt.core.compiler.compliance=21
org.eclipse.jdt.core.compiler.codegen.targetPlatform=21

org.eclipse.jdt.core.formatter.tabulation.char=space
org.eclipse.jdt.core.formatter.tabulation.size=4
org.eclipse.jdt.core.formatter.indentation.size=4
org.eclipse.jdt.core.formatter.use_tabs_only_for_leading_indentations=false
org.eclipse.jdt.core.formatter.continuation_indentation=2
org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=2
org.eclipse.jdt.core.formatter.lineSplit=120
org.eclipse.jdt.core.formatter.join_wrapped_lines=true
org.eclipse.jdt.core.formatter.number_of_empty_lines_to_preserve=1
org.eclipse.jdt.core.formatter.insert_new_line_at_end_of_file_if_missing=insert
org.eclipse.jdt.core.formatter.blank_lines_before_first_class_body_declaration=1

org.eclipse.jdt.core.formatter.comment.line_length=120
org.eclipse.jdt.core.formatter.comment.format_javadoc_comments=false
org.eclipse.jdt.core.formatter.comment.format_block_comments=false
org.eclipse.jdt.core.formatter.comment.format_line_comments=false
org.eclipse.jdt.core.formatter.comment.format_header=false
org.eclipse.jdt.core.formatter.never_indent_line_comments_on_first_column=true
org.eclipse.jdt.core.formatter.never_indent_block_comments_on_first_column=true

org.eclipse.jdt.core.formatter.keep_anonymous_type_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_method_body_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_type_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_lambda_body_block_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_enum_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_enum_constant_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_record_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_record_constructor_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_annotation_declaration_on_one_line=one_line_if_empty

org.eclipse.jdt.core.formatter.alignment_for_arguments_in_allocation_expression=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_annotation=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_enum_constant=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_explicit_constructor_call=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_method_invocation=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_qualified_allocation_expression=48
org.eclipse.jdt.core.formatter.alignment_for_enum_constants=48
org.eclipse.jdt.core.formatter.alignment_for_expressions_in_array_initializer=48
org.eclipse.jdt.core.formatter.alignment_for_multiple_fields=48
org.eclipse.jdt.core.formatter.alignment_for_parameters_in_constructor_declaration=48
org.eclipse.jdt.core.formatter.alignment_for_parameters_in_method_declaration=48
org.eclipse.jdt.core.formatter.alignment_for_permitted_types_in_type_declaration=48
org.eclipse.jdt.core.formatter.alignment_for_record_components=48
org.eclipse.jdt.core.formatter.alignment_for_resources_in_try=48
org.eclipse.jdt.core.formatter.alignment_for_type_arguments=48
org.eclipse.jdt.core.formatter.alignment_for_type_parameters=48

org.eclipse.jdt.core.formatter.alignment_for_binary_expression=48
org.eclipse.jdt.core.formatter.alignment_for_additive_operator=48
org.eclipse.jdt.core.formatter.alignment_for_bitwise_operator=48
org.eclipse.jdt.core.formatter.alignment_for_conditional_expression=48
org.eclipse.jdt.core.formatter.alignment_for_logical_operator=48
org.eclipse.jdt.core.formatter.alignment_for_multiplicative_operator=48
org.eclipse.jdt.core.formatter.alignment_for_relational_operator=48
org.eclipse.jdt.core.formatter.alignment_for_shift_operator=48
org.eclipse.jdt.core.formatter.alignment_for_string_concatenation=48

org.eclipse.jdt.core.formatter.alignment_for_selector_in_method_invocation=80

org.eclipse.jdt.core.formatter.alignment_for_superclass_in_type_declaration=16
org.eclipse.jdt.core.formatter.alignment_for_superinterfaces_in_type_declaration=16
org.eclipse.jdt.core.formatter.alignment_for_throws_clause_in_constructor_declaration=16
org.eclipse.jdt.core.formatter.alignment_for_throws_clause_in_method_declaration=16
org.eclipse.jdt.core.formatter.alignment_for_union_type_in_multicatch=16

org.eclipse.jdt.core.formatter.parenthesis_positions_in_method_declaration=common_lines
org.eclipse.jdt.core.formatter.parenthesis_positions_in_method_invocation=common_lines
org.eclipse.jdt.core.formatter.parenthesis_positions_in_annotation=common_lines
org.eclipse.jdt.core.formatter.parenthesis_positions_in_enum_constant_declaration=common_lines
org.eclipse.jdt.core.formatter.parenthesis_positions_in_record_declaration=common_lines
org.eclipse.jdt.core.formatter.parenthesis_positions_in_lambda_declaration=common_lines

org.eclipse.jdt.core.formatter.insert_space_before_opening_brace_in_array_initializer=insert
